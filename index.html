<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f7f1">
  <meta name="description" content="A simple two-player Tic-Tac-Toe game for VOSC Activity-1.">
  <title>Tic-Tac-Toe | VOSC Activity-1</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="game-shell">
    <header class="page-header">
      <p class="eyebrow">VOSC ACTIVITY-1</p>
      <h1>Tic-Tac-Toe</h1>
      <p class="intro">A little friendly rivalry, one square at a time.</p>
    </header>

    <section class="game-panel" aria-label="Tic-Tac-Toe game">
      <div class="scoreboard" aria-label="Scoreboard">
        <div class="score score-x">
          <span class="score-symbol" aria-hidden="true">X</span>
          <span class="score-label">Player X</span>
          <span class="score-value" id="score-x">0</span>
        </div>
        <div class="score score-draws">
          <span class="score-symbol" aria-hidden="true">=</span>
          <span class="score-label">Draws</span>
          <span class="score-value" id="score-draws">0</span>
        </div>
        <div class="score score-o">
          <span class="score-symbol" aria-hidden="true">O</span>
          <span class="score-label">Player O</span>
          <span class="score-value" id="score-o">0</span>
        </div>
      </div>

      <p class="game-status" id="game-status" aria-live="polite" aria-atomic="true">
        Player X's turn
      </p>

      <div class="board" role="group" aria-label="Tic-Tac-Toe board">
        <button class="cell" type="button" data-index="0" aria-label="Cell 1, empty"></button>
        <button class="cell" type="button" data-index="1" aria-label="Cell 2, empty"></button>
        <button class="cell" type="button" data-index="2" aria-label="Cell 3, empty"></button>
        <button class="cell" type="button" data-index="3" aria-label="Cell 4, empty"></button>
        <button class="cell" type="button" data-index="4" aria-label="Cell 5, empty"></button>
        <button class="cell" type="button" data-index="5" aria-label="Cell 6, empty"></button>
        <button class="cell" type="button" data-index="6" aria-label="Cell 7, empty"></button>
        <button class="cell" type="button" data-index="7" aria-label="Cell 8, empty"></button>
        <button class="cell" type="button" data-index="8" aria-label="Cell 9, empty"></button>
      </div>

      <button class="new-game-button" id="new-game" type="button">New Game</button>
    </section>

    <footer class="page-footer">Two players · One board · Your move</footer>
  </main>
</body>
</html>
